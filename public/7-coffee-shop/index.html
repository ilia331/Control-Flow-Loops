<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>7. Coffee Shop</h1>
      <form id="form">
        <label
          >Drink<select id="drink">
            <option>coffee</option>
            <option>tea</option>
            <option>soda</option>
            <option>water</option>
          </select></label
        ><label
          >Extra 1<select id="x">
            <option value="">none</option>
            <option>sugar</option>
            <option>creamer</option>
          </select></label
        ><label
          >Extra 2<select id="y">
            <option value="">none</option>
            <option>sugar</option>
            <option>creamer</option>
          </select></label
        ><button>Calculate</button>
      </form>
      <output id="result"></output>
    </main>
    <script src="script.js"></script>
  </body>
</html>
